name: Keep Supabase Alive

# Corre automáticamente domingos y miércoles a las 09:00 UTC — un margen
# cómodo contra el límite de 7 días de inactividad de Supabase.
# "workflow_dispatch" además te deja correrlo a mano desde la pestaña
# "Actions" de GitHub, para probarlo sin esperar al horario programado.
on:
  schedule:
    - cron: "0 9 * * 0,3"
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase database
        run: |
          # "tr -d '[:space:]'" borra cualquier espacio, tab o salto de
          # línea invisible que se haya colado al pegar el secret en
          # GitHub — así el workflow funciona sin importar si el
          # copy-paste salió perfecto o no.
          URL=$(echo "${{ secrets.SUPABASE_URL }}" | tr -d '[:space:]')
          KEY=$(echo "${{ secrets.SUPABASE_ANON_KEY }}" | tr -d '[:space:]')

          echo "Pingueando: $URL"

          curl --fail --silent --show-error \
            "$URL/rest/v1/Product?select=id&limit=1" \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY"
